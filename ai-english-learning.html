<!DOCTYPE html>

<head>

        .week-btn {

        .week-title {

            margin: 20px 0 15px;

        }

        .word {

            background: #e74c3c;
            color: white;
            border: none;

            cursor: pointer;

        }

            text-align: center;
            color: #888;
            font-size: 13px;
            margin-top: 5px;

            margin-top: 40px;

<h1>🗣️ AI 英语单词朗读学习</h1>
<p class="subtitle">点击蓝色单词即可听发音 · 浏览器自带朗读，无需联网</p>

<div class="week-nav" id="weekNav"></div>

<div id="content"></div>

<div class="footer">
    基于 AI 英语学习计划生成 · 使用 Web Speech API 朗读

            { word: "encoder", phonetic: "/ɪnˈkəʊdər/", meaning: "编码器", example: "The encoder processes the input sequence." },

            { word: "instruction tuning", phonetic: "/ɪnˈstrʌkʃən ˈtjuːnɪŋ/", meaning: "指令微调", example: "Instruction tuning improves following ability." },
            { word: "zero-shot", phonetic: "/ˈzɪərəʊ ʃɒt/", meaning: "零样本", example: "The model does zero-shot classification." },
            { word: "few-shot", phonetic: "/fjuː ʃɒt/", meaning: "少样本", example: "Few-shot learning needs only a few examples." },
            { word: "涌现", phonetic: "/ˌɪməˈdʒɜːns/", meaning: "emergence", example: "Complex behaviors emerge from simple rules." },
        ]
    },
    {
        title: "Week 6：训练与优化",
        words: [

            { word: "learning rate", phonetic: "/ˈlɜːnɪŋ reɪt/", meaning: "学习率", example: "The learning rate controls step size." },

            { word: "dropout", phonetic: "/ˈdrɒpˌaʊt/", meaning: "Dropout随机失活", example: "Dropout randomly disables neurons." },
            { word: "hyperparameter", phonetic: "/ˌhaɪpəpəˈræmɪtər/", meaning: "超参数", example: "Learning rate is a key hyperparameter." },
            { word: "validation", phonetic: "/ˌvælɪˈdeɪʃən/", meaning: "验证", example: "We use a validation set to tune parameters." },
            { word: "cross-entropy", phonetic: "/krɒs ˈentrəpi/", meaning: "交叉熵", example: "Cross-entropy is a common loss function." },
            { word: "backpropagation", phonetic: "/ˌbækprɒpəˈɡeɪʃən/", meaning: "反向传播", example: "Backpropagation computes gradients." },

        ]
    },
    {
        title: "Week 7：评估与部署",
        words: [
            { word: "benchmark", phonetic: "/ˈbentʃmɑːk/", meaning: "基准测试", example: "We evaluate on standard benchmarks." },
            { word: "metric", phonetic: "/ˈmetrɪk/", meaning: "评估指标", example: "Accuracy is a common metric." },

    {

        words: [

            { word: "pipeline", phonetic: "/ˈpaɪplaɪn/", meaning: "流水线", example: "The ML pipeline includes data processing." },
            { word: "upstream", phonetic: "/ˈʌpstriːm/", meaning: "上游", example: "The upstream model needs fine-tuning." },
            { word: "downstream", phonetic: "/ˈdaʊnstriːm/", meaning: "下游", example: "Downstream tasks use the embeddings." },
            { word: "ground truth", phonetic: "/ɡraʊnd trʌθ/", meaning: "真实标签", example: "We compare predictions against ground truth." },
            { word: "reward", phonetic: "/rɪˈwɔːd/", meaning: "奖励", example: "The agent receives a reward signal." },
            { word: "policy", phonetic: "/ˈpɒləsi/", meaning: "策略", example: "The policy network selects actions." },
            { word: "generative", phonetic: "/ˈdʒenərətɪv/", meaning: "生成式的", example: "Generative AI creates new content." },

let totalWords = 0;
weeks.forEach((w, wi) => { totalWords += w.words.length; });

// 生成导航按钮
const nav = document.getElementById('weekNav');
weeks.forEach((w, i) => {
    const btn = document.createElement('button');
    btn.className = 'week-btn' + (i === 0 ? ' active' : '');
    btn.textContent = `Week ${i + 1}`;
    btn.onclick = () => showWeek(i);
    nav.appendChild(btn);
});

function speak(text) {
    if (!text) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.85;
    utterance.pitch = 1.0;
    // 尝试找一个英文声音
    const voices = window.speechSynthesis.getVoices();
    const enVoice = voices.find(v => v.lang.startsWith('en')) || voices[0];
    if (enVoice) utterance.voice = enVoice;
    window.speechSynthesis.speak(utterance);
}

// 等待声音列表加载
window.speechSynthesis.onvoiceschanged = () => {
    window.speechSynthesis.getVoices();
};

function showWeek(index) {
    document.querySelectorAll('.week-btn').forEach((b, i) => {
        b.classList.toggle('active', i === index);
    });
    document.querySelectorAll('.week-section').forEach((s, i) => {
        s.classList.toggle('active', i === index);
    });
}

function renderAll() {
    const container = document.getElementById('content');
    weeks.forEach((week, wi) => {
        const section = document.createElement('div');
        section.className = 'week-section' + (wi === 0 ? ' active' : '');

        let tableRows = week.words.map(w => `
            <tr>
                <td><span class="word" onclick="speak('${w.word}')">${w.word}</span></td>
                <td class="phonetic">${w.phonetic}</td>
                <td class="meaning">${w.meaning}</td>
                <td class="example">${w.example}</td>
            </tr>
        `).join('');

        section.innerHTML = `
            <h2 class="week-title">${week.title}</h2>
            <table>
                <thead>
                    <tr>
                        <th>单词（点击朗读）</th>
                        <th>音标</th>
                        <th>中文</th>
                        <th>例句</th>
                    </tr>
                </thead>
                <tbody>${tableRows}</tbody>
            </table>
        `;
        container.appendChild(section);
    });
}

renderAll();
</script>
</body>
</html>
