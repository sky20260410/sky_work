    <style>

        .header { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; padding: 20px 16px; text-align: center; }

        .nav button { padding: 6px 14px; border: 1px solid #ddd; background: white; border-radius: 16px; font-size: 12px; cursor: pointer; transition: all 0.2s; color: #555; }
        .nav button:hover { border-color: #11998e; color: #11998e; }
        .nav button.active { background: #11998e; color: white; border-color: #11998e; }
        .content { padding: 12px; }
        .week-section { display: none; }
        .week-section.active { display: block; }
        .week-title { font-size: 16px; color: #333; margin-bottom: 10px; padding: 8px 12px; background: linear-gradient(135deg, #11998e22, #38ef7d22); border-radius: 8px; border-left: 4px solid #11998e; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        th { background: #11998e; color: white; padding: 8px 10px; text-align: left; font-size: 11px; font-weight: 500; }
        td { padding: 8px 10px; border-bottom: 1px solid #f0f0f0; font-size: 12px; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }

        .word-btn { background: #11998e; color: white; border: none; padding: 5px 12px; border-radius: 14px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: all 0.2s; white-space: nowrap; }

        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }
        .icon { font-size: 10px; }
        .spelling { color: #e67e22; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
        .phonetic { color: #888; font-size: 11px; }
        .meaning { color: #444; }
        .example { color: #888; font-size: 12px; font-style: italic; }
        .footer { text-align: center; padding: 20px; color: #999; font-size: 11px; }
        @media (max-width: 600px) { .header h1 { font-size: 18px; } th, td { padding: 6px 8px; font-size: 11px; } .spelling, .phonetic { font-size: 10px; } }
    </style>

{ title: "Unit 4: My Home 我的家", words: [
        { word: "bedroom", phonetic: "/ˈbedruːm/", spelling: "bed·room", meaning: "卧室", example: "I sleep in my bedroom." },
        { word: "living room", phonetic: "/ˈlɪvɪŋ/", spelling: "liv·ing room", meaning: "客厅", example: "We watch TV in the living room." },
        { word: "study", phonetic: "/ˈstʌdi/", spelling: "stu·dy", meaning: "书房", example: "My father is in the study." },
        { word: "kitchen", phonetic: "/ˈkɪtʃɪn/", spelling: "kitch·en", meaning: "厨房", example: "My mother cooks in the kitchen." },
        { word: "bathroom", phonetic: "/ˈbɑːθruːm/", spelling: "bath·room", meaning: "浴室", example: "I wash my hands in the bathroom." },
        { word: "bed", phonetic: "/bed/", spelling: "bed", meaning: "床", example: "It is time for bed." },
        { word: "phone", phonetic: "/fəʊn/", spelling: "phone", meaning: "电话", example: "My phone is on the table." },
        { word: "table", phonetic: "/ˈteɪbl/", spelling: "ta·ble", meaning: "桌子", example: "The books are on the table." },
        { word: "sofa", phonetic: "/ˈsəʊfə/", spelling: "so·fa", meaning: "长沙发", example: "I sit on the sofa and watch TV." },
        { word: "fridge", phonetic: "/frɪdʒ/", spelling: "fridge", meaning: "冰箱", example: "The milk is in the fridge." },
        { word: "find", phonetic: "/faɪnd/", spelling: "find", meaning: "找到", example: "I cannot find my bag." },
        { word: "them", phonetic: "/ðəm/", spelling: "them", meaning: "他/她/它们", example: "I see them at school." }
    ]},
{ title: "Unit 5: Dinner's Ready 晚餐准备好了", words: [
        { word: "beef", phonetic: "/biːf/", spelling: "beef", meaning: "牛肉", example: "I like beef noodles best." },
        { word: "chicken", phonetic: "/ˈtʃɪkɪn/", spelling: "chick·en", meaning: "鸡肉", example: "I eat chicken for lunch." },
        { word: "noodles", phonetic: "/ˈnuːdlz/", spelling: "noo·dles", meaning: "面条", example: "I would like some noodles, please." },
        { word: "soup", phonetic: "/suːp/", spelling: "soup", meaning: "汤", example: "This soup is very delicious." },
        { word: "vegetable", phonetic: "/ˈvedʒtəbl/", spelling: "veg·e·ta·ble", meaning: "蔬菜", example: "Eat more vegetables, they are healthy." },
        { word: "chopsticks", phonetic: "/ˈtʃɒpstɪks/", spelling: "chop·sticks", meaning: "筷子", example: "I use chopsticks to eat noodles." },
        { word: "bowl", phonetic: "/bəʊl/", spelling: "bowl", meaning: "碗", example: "I put the rice in the bowl." },
        { word: "fork", phonetic: "/fɔːk/", spelling: "fork", meaning: "餐叉", example: "I use a fork to eat salad." },
        { word: "knife", phonetic: "/naɪf/", spelling: "knife", meaning: "刀", example: "Be careful with the knife." },
        { word: "spoon", phonetic: "/spuːn/", spelling: "spoon", meaning: "匙；勺子", example: "I drink soup with a spoon." },
        { word: "dinner", phonetic: "/ˈdɪnə(r)/", spelling: "din·ner", meaning: "正餐", example: "What do you have for dinner?" },
        { word: "ready", phonetic: "/ˈredi/", spelling: "read·y", meaning: "准备好", example: "Are you ready to order?" },
        { word: "help yourself", phonetic: "/jɔːˈself/", spelling: "help your·self", meaning: "为（自己）取用", example: "Help yourself to some fruit." },
        { word: "pass", phonetic: "/pɑːs/", spelling: "pass", meaning: "给；递", example: "Pass me the salt, please." },
        { word: "try", phonetic: "/traɪ/", spelling: "try", meaning: "试；尝试", example: "Try this fish, it is yummy!" }
    ]},
{ title: "Unit 6: Meet My Family! 认识我的家人！", words: [
        { word: "parents", phonetic: "/ˈpeərənts/", spelling: "pa·rents", meaning: "父母", example: "My parents are very kind." },
        { word: "cousin", phonetic: "/ˈkʌzn/", spelling: "cous·in", meaning: "同辈表/堂亲", example: "My cousin is my uncle's daughter." },

        { word: "aunt", phonetic: "/ɑːnt/", spelling: "aunt", meaning: "姑母；姨母", example: "My aunt makes delicious cakes." },
        { word: "baby brother", phonetic: "/ˈbeɪbi/", spelling: "ba·by bro·ther", meaning: "婴儿小弟弟", example: "I have a baby brother, he is cute." },

        { word: "driver", phonetic: "/ˈdraɪvə(r)/", spelling: "dri·ver", meaning: "司机", example: "My uncle is a bus driver." },
        { word: "farmer", phonetic: "/ˈfɑːmə(r)/", spelling: "farm·er", meaning: "农民", example: "The farmer grows vegetables on the farm." },
        { word: "nurse", phonetic: "/nɜːs/", spelling: "nurse", meaning: "护士", example: "The nurse helps the doctor." },
        { word: "people", phonetic: "/ˈpiːpl/", spelling: "peo·ple", meaning: "人们", example: "Many people visit the park on Sunday." },
        { word: "but", phonetic: "/bʌt/", spelling: "but", meaning: "但是", example: "I like apples but not bananas." },
        { word: "little", phonetic: "/ˈlɪtl/", spelling: "lit·tle", meaning: "小的", example: "The little puppy is so cute." },
        { word: "puppy", phonetic: "/ˈpʌpi/", spelling: "pup·py", meaning: "小狗", example: "I want a puppy as a pet." },
        { word: "football player", phonetic: "/ˈfʊtbɔːl ˈpleɪə(r)/", spelling: "foot·ball play·er", meaning: "足球运动员", example: "My brother wants to be a football player." },
        { word: "job", phonetic: "/dʒɒb/", spelling: "job", meaning: "工作", example: "What is your mother's job?" },
        { word: "basketball", phonetic: "/ˈbɑːskɪtbɔːl/", spelling: "base·ket·ball", meaning: "篮球", example: "I play basketball with my friends." }
    ]}
];

let voices = [];
let currentUtterance = null;
let currentBtn = null;

function initVoices() {
    voices = window.speechSynthesis.getVoices();
}
initVoices();
window.speechSynthesis.onvoiceschanged = initVoices;

function getBestVoice() {
    if (!voices.length) voices = window.speechSynthesis.getVoices();
    const priority = [
        v => v.lang === 'en-US' && /Samantha|Karen|Victoria|Siri/.test(v.name),
        v => v.lang === 'en-US',
        v => v.lang.startsWith('en'),
    ];
    for (const filter of priority) {
        const found = voices.filter(filter);
        if (found.length) return found[0];
    }
    return voices[0] || null;
}

function speak(text, btn) {
    if (!text) return;
    if (currentUtterance && currentBtn === btn) {
        window.speechSynthesis.cancel();
        currentUtterance = null;
        if (btn) btn.classList.remove('playing');
        currentBtn = null;
        return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.8;
    utterance.pitch = 1.0;
    const voice = getBestVoice();
    if (voice) utterance.voice = voice;
    utterance.onstart = () => {
        if (currentBtn && currentBtn !== btn) currentBtn.classList.remove('playing');
        if (btn) btn.classList.add('playing');
        currentBtn = btn;
    };
    utterance.onend = utterance.onerror = () => {
        if (btn) btn.classList.remove('playing');
        currentBtn = null;
    };
    currentUtterance = utterance;
    window.speechSynthesis.speak(utterance);
}

const nav = document.getElementById('weekNav');
weeks.forEach((w, i) => {
    const btn = document.createElement('button');
    btn.className = 'week-btn' + (i === 0 ? ' active' : '');
    btn.textContent = `Unit ${i + 1}`;
    btn.onclick = () => showWeek(i);
    nav.appendChild(btn);
});

function showWeek(index) {
    document.querySelectorAll('.week-btn').forEach((b, i) => {
        b.classList.toggle('active', i === index);
    });
    document.querySelectorAll('.week-section').forEach((s, i) => {
        s.classList.toggle('active', i === index);
    });
}

function renderAll() {
    const container = document.getElementById('content');
    weeks.forEach((week, wi) => {
        const section = document.createElement('div');
        section.className = 'week-section' + (wi === 0 ? ' active' : '');
        const tableRows = week.words.map(w => `
            <tr>
                <td><button class="word-btn" onclick="speak('${w.word}', this)"><span class="icon">▶</span>${w.word}</button></td>
                <td class="spelling">${w.spelling}</td>
                <td class="phonetic">${w.phonetic}</td>
                <td class="meaning">${w.meaning}</td>
                <td class="example">${w.example}</td>
            </tr>
        `).join('');
        section.innerHTML = `
            <h2 class="week-title">${week.title}</h2>
            <table>
                <thead><tr><th>单词（点击▶朗读）</th><th>自然拼读</th><th>音标</th><th>中文</th><th>例句</th></tr></thead>
                <tbody>${tableRows}</tbody>
            </table>
        `;
        container.appendChild(section);
    });
}

renderAll();
document.body.addEventListener('touchstart', () => {}, { once: true });
</script>
